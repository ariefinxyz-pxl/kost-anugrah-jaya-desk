:root{--bg:#f4f6fb;--sf:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#e2e7f0;--or:#f8621b;--bl:#2f5eaa;--ok:#14884a;--okb:#e3f6ec;--er:#c62f2f;--erb:#fdeaea;--wa:#fff4dc;--wt:#9a6200;--bk:#128c7e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#10151f;--sf:#192130;--tx:#e8edf6;--mu:#93a0b4;--bd:#2a3447;--ok:#4cd08a;--okb:#143324;--er:#ff7b7b;--erb:#3a1a1a;--wa:#3a2d10;--wt:#f0b84d;--bl:#6c9bf0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--bl);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{width:38px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
header h1{font-size:18px;margin:0}header small{opacity:.85;display:block;font-size:12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:2px solid var(--or);display:flex;overflow-x:auto;scrollbar-width:none}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mu);padding:12px 14px;font:600 14px inherit;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--or);border-color:var(--or)}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:16px 0 8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.item .t{font-weight:700}.item .s{color:var(--mu);font-size:13px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button,.btn{font:600 13.5px inherit;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.pri{background:var(--or);border-color:var(--or);color:#fff}.blu{background:var(--bl);border-color:var(--bl);color:#fff}.wa{background:#25d366;border-color:#25d366;color:#06361b}.dng{color:var(--er)}
button:disabled,.dis{opacity:.45;pointer-events:none}
.bd{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lunas,.Terisi{background:var(--okb);color:var(--ok)}.terlambat{background:var(--erb);color:var(--er)}.segera,.belum,.Kosong,.Perbaikan{background:var(--wa);color:var(--wt)}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:12.5px;color:var(--mu);margin:9px 0 3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools select,.tools input{width:auto;flex:1 1 130px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}td.r,th.r{text-align:right}
.sc{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.bar{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}.bar div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bar i{display:block;background:var(--or);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--sf);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.chip.on{background:var(--bl);color:#fff;border-color:var(--bl)}

:root[data-theme=dark]{--bg:#0b1020;--sf:#141b2e;--bd:#25304a;--tx:#e9eef9;--mu:#8e9ab2}
.ic{width:20px;height:20px;display:block;flex:none}
header{background:radial-gradient(120% 140% at 100% 0,#f8621b66,#0000 55%),linear-gradient(160deg,#2f5eaa,#1b3c78);padding:16px 18px 30px;border-radius:0 0 28px 28px;box-shadow:0 10px 30px #17356b55;gap:14px}
header h1{font-size:20px;font-weight:800;letter-spacing:.3px}

.lg{position:relative;overflow:hidden;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;border:3px solid transparent;background:linear-gradient(145deg,#fff,#e3eafa) padding-box,conic-gradient(from 210deg,#f8621b,#ffb36b,#6c9bf0,#f8621b) border-box;box-shadow:0 8px 20px #0005}
.lg::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff0 30%,#fffc 48%,#fff0 66%);background-size:250% 100%;animation:sh 4.5s infinite}
@keyframes sh{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
header .lg img{width:auto;height:40px;padding:0;background:none;border-radius:0;filter:drop-shadow(0 3px 3px #0004)}
.tg{margin-left:auto;width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid #fff3;background:#ffffff1f;color:#fff;box-shadow:none}
.tg .sun,[data-theme=dark] .tg .moon{display:none}[data-theme=dark] .tg .sun{display:block}
nav{margin:-18px 12px 0;border:1px solid var(--bd);border-radius:18px;background:color-mix(in srgb,var(--sf) 86%,transparent);backdrop-filter:blur(14px);box-shadow:0 8px 24px #0002;padding:5px;gap:4px;top:calc(8px + env(safe-area-inset-top,0px))}
nav button{display:flex;align-items:center;gap:6px;border:0;border-radius:13px;padding:9px 13px;margin:0;box-shadow:none;background:none}
nav button.on{background:linear-gradient(135deg,#ff7a2e,#f8621b);color:#fff;box-shadow:0 5px 14px #f8621b66}
nav .ic{width:18px;height:18px}
button,.btn{border-radius:12px;padding:9px 14px;transition:transform .12s,box-shadow .2s;box-shadow:0 1px 2px #0001}
button:active,.btn:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,#ff7a2e,#f8621b 55%,#e04e0c);border:0;box-shadow:0 6px 16px #f8621b55}
.blu{background:linear-gradient(135deg,#4a7fd6,#2f5eaa);border:0;box-shadow:0 6px 16px #2f5eaa55}
.wa{background:linear-gradient(135deg,#3ee27f,#1fb855);border:0;color:#04301a;box-shadow:0 6px 16px #25d36655}
.dng{background:var(--erb);border-color:transparent}.chip{border-radius:99px}
.card,.item,.sc{border-radius:16px;box-shadow:0 2px 12px #0000000d}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;background:radial-gradient(90% 120% at 0 0,#f8621b99,#0000 60%),linear-gradient(135deg,#1c3d78,#2f5eaa);box-shadow:0 12px 28px #2f5eaa44;margin-bottom:12px}
.hero small{opacity:.85}.hero h2{margin:2px 0 10px;font-size:20px}.hero .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#ffffff26}
.dn{width:120px;display:block;margin:0 auto}.hero .dn{width:92px;flex:none}.dc{font:800 17px system-ui;fill:var(--tx)}.ds{font:600 7px system-ui;fill:var(--mu)}.hero .dc{fill:#fff}.hero .ds{fill:#ffffffb8}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;font-size:12px}.qa .ic{width:22px;height:22px;color:var(--or)}
.stat{position:relative;overflow:hidden;padding-left:16px}.stat::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--ac,var(--or))}
.stat .ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac,var(--or)) 16%,transparent);color:var(--ac,var(--or));margin-bottom:8px}
.ch{padding:14px;margin-bottom:10px}.ch .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ch h3{margin:0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:3px;gap:2px}.seg button{border:0;box-shadow:none;background:none;padding:5px 10px;border-radius:8px;font-size:12px;color:var(--mu)}.seg button.on{background:var(--sf);color:var(--or);box-shadow:0 1px 4px #0003}
.ax{font:600 8.5px system-ui;fill:var(--mu)}.vl{font:700 8px system-ui;fill:var(--tx)}
.cg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:6px}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);justify-content:center;margin:8px 0}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 90% at 100% 0,#f8621b55,#0000 55%),linear-gradient(160deg,#2f5eaa,#12285a)}.lock[hidden]{display:none}
body.lk main,body.lk nav,body.lk header{display:none}
.lb{width:100%;max-width:340px;background:var(--sf);border-radius:24px;padding:22px;box-shadow:0 20px 50px #0006}.lb h2{text-align:center;margin:10px 0 2px}.lb p{text-align:center;color:var(--mu);margin:0 0 6px}#le{color:var(--er);font-size:12.5px;min-height:16px;margin-top:8px}

<script>
const $=s=>document.querySelector(s),KEY='kaj-v1',MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TODAY=iso(new Date());
const fd=s=>{if(!s)return'-';const[y,m,d]=s.split('-');return +d+' '+MN[m-1].slice(0,3)+' '+y},ml=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
function addM(s,k){const[y,m,d]=s.split('-').map(Number);const t=(y*12+m-1)+k,Y=Math.floor(t/12),M=t%12;const dm=new Date(Y,M+1,0).getDate();return Y+'-'+pad(M+1)+'-'+pad(Math.min(d,dm))}
const mdiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)),uid=()=>Math.random().toString(36).slice(2,9);
const TPL0='Halo {nama}, salam dari {kost}.\n\nMengingatkan tagihan kost kamar {kamar} periode {periode}:\nJumlah: {jumlah}\nJatuh tempo: {jatuh_tempo}\n\n{rekening}\nMohon konfirmasi setelah pembayaran. Terima kasih 🙏';
const TPL1='Halo {nama}, pembayaran kost kamar {kamar} periode {periode} sebesar {jumlah} sudah kami terima (LUNAS). Terima kasih 🙏\n– {kost}';
function seed(){
 const R=[[401,1700000],[402,1000000],[403,1700000],[405,1700000],[406,1700000],[407,1700000],[408,1400000],[409,1400000],[309,2000000],[310,2000000],[311,1700000],[312,2000000]].map(([no,rate])=>({no:String(no),type:'Standard View',rate,status:'Kosong'}));
 const T=[['401','Boas Natania Silaban','6281296239282','2026-10-10'],['402','Maya Krisdayanti','','2025-02-10'],['403','Ingrieth Rumampuk','628114920808','2026-10-20'],['405','Ismail S.E','628124865870','2026-06-10'],['406',"Nur Ma'ruf Ardiansyah",'6283819574508','2026-10-04'],['407','Ingrieth Rumampuk / Syamfikri Hakim','628114920808','2026-06-10'],['310','Agus Zaenuri Rizal','6282124661797','2026-09-19'],['311','Eka Syahbudi','6282122852227','2026-06-10'],['312','Eko Setiawan','6285180982328','2026-10-13']].map(([room,name,wa,entry])=>({id:'t'+room,room,name,wa,entry,active:true}));
 const P=[];T.forEach(t=>{const rate=R.find(r=>r.no==t.room).rate;for(let k=0;;k++){const due=addM(t.entry,k);if(due>'2026-10-31')break;P.push({id:t.id+'-'+due,tid:t.id,due,amount:rate,paid:due,method:'Pelunasan awal',note:''})}});
 return{rooms:R,tenants:T,pays:P,tpl:TPL0,tpl2:TPL1,rek:'',kost:'Kost Anugrah Jaya'}}
let S={rooms:[],tenants:[],pays:[],tpl:TPL0,tpl2:TPL1,rek:'',kost:'Kost Anugrah Jaya'},DB=null,ready=false;
const COLS={rooms:'no',tenants:'id',pays:'id'},RM={rooms:{},tenants:{},pays:{},cfg:''},loaded={};
const js=o=>JSON.stringify(Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined).sort(([a],[b])=>a<b?-1:1)));
const cfgOf=()=>({tpl:S.tpl,tpl2:S.tpl2,rek:S.rek,kost:S.kost});
let pend=Promise.resolve();
function save(){if(!ready)return;if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}return}
 const ops=[];for(const c in COLS){const k=COLS[c],cur={};S[c].forEach(o=>cur[o[k]]=js(o));
  for(const id in cur)if(RM[c][id]!==cur[id]){RM[c][id]=cur[id];ops.push(()=>DB.collection(c).doc(String(id)).set(JSON.parse(cur[id])))}
  for(const id in RM[c])if(!(id in cur)){delete RM[c][id];ops.push(()=>DB.collection(c).doc(String(id)).delete())}}
 const cf=js(cfgOf());if(cf!==RM.cfg){RM.cfg=cf;ops.push(()=>DB.doc('cfg/main').set(JSON.parse(cf)))}
 ops.forEach(f=>{pend=pend.then(f).catch(()=>toast('Gagal menyimpan ke server'))})}
function got(c){loaded[c]=1;if(Object.keys(loaded).length<4)return;ready=true;const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA/.test(a.tagName))return;render(true)}

function tenForm(id){const t=id?ten(id):{room:'',name:'',wa:'',entry:TODAY},free=S.rooms.filter(r=>rstat(r)!='Terisi'||r.no==t.room).map(r=>[r.no,`Kamar ${r.no} (${rp(r.rate)})`]);
 if(!free.length)return toast('Tidak ada kamar kosong');
 modal(id?'Edit penghuni':'Penghuni baru',`<label>Kamar</label><select name="room">${opt(free,t.room)}</select><label>Nama</label><input name="name" value="${esc(t.name)}" required><label>No. WhatsApp (628…)</label><input name="wa" inputmode="tel" value="${esc(t.wa)}"><label>Tanggal masuk (jatuh tempo bulanan mengikuti tanggal ini)</label><input type="date" name="entry" value="${t.entry}" required>${id?'':'<label><input type="checkbox" name="paid1" checked style="width:auto"> Periode pertama sudah dibayar</label>'}`,f=>{if(id)Object.assign(t,{room:f.room,name:f.name,wa:f.wa,entry:f.entry});else{const n={id:uid(),room:f.room,name:f.name,wa:f.wa,entry:f.entry,active:true};S.tenants.push(n);if(f.paid1)S.pays.push({id:uid(),tid:n.id,due:n.entry,amount:room(n.room).rate,paid:n.entry,method:'Tunai',note:'Pembayaran pertama'})}render()})}
function checkout(id){if(confirm('Tandai penghuni sudah keluar? Kamar menjadi kosong.')){ten(id).active=false;ten(id).out=TODAY;render()}}
function hist(id){const t=ten(id),L=S.pays.filter(p=>p.tid==id).sort((a,b)=>b.due.localeCompare(a.due));modal('Riwayat · '+esc(t.name),`<div class="sc"><table>${L.map(p=>`<tr><td>${ml(p.due.slice(0,7))}</td><td>${fd(p.paid)}</td><td class="r">${rp(p.amount)}</td></tr>`).join('')}</table></div>`)}
function roomForm(no){const r=no?room(no):{no:'',type:'Standard View',rate:1500000,status:'Kosong'};modal(no?'Edit kamar':'Kamar baru',`<label>No. kamar</label><input name="no" value="${esc(r.no)}" required ${no?'readonly':''}><label>Tipe</label><input name="type" value="${esc(r.type)}"><label>Tarif / bulan (Rp)</label><input type="number" name="rate" value="${r.rate}" required><label>Status (jika tanpa penghuni)</label><select name="status">${opt([['Kosong','Kosong'],['Perbaikan','Perbaikan']],r.status)}</select>`,f=>{if(!no&&room(f.no)){toast('No. kamar sudah ada');return false}if(no)Object.assign(r,{type:f.type,rate:+f.rate,status:f.status});else S.rooms.push({no:f.no,type:f.type,rate:+f.rate,status:f.status});render()})}
function delRoom(no){if(S.tenants.some(t=>t.active&&t.room==no))return toast('Kamar masih dihuni');if(confirm('Hapus kamar '+no+'?')){S.rooms=S.rooms.filter(r=>r.no!=no);render()}}
function bulk(){const B=bills(bm).filter(b=>!b.pay&&phone(b.t.wa));modal('WA massal · '+ml(bm),B.length?`<p class="s" style="color:var(--mu)">Browser membatasi pembukaan banyak tab sekaligus, jadi klik satu per satu.</p>`+B.map(b=>`<div class="row item"><span>${b.t.room} · ${esc(b.t.name)}</span><a class="btn wa" target="_blank" rel="noopener" href="${wal(b)}">Kirim</a></div>`).join(''):'Tidak ada tagihan belum bayar dengan nomor WA.')}
function saveSet(){S.kost=$('#sk').value||'Kost Anugrah Jaya';S.rek=$('#sr').value;S.tpl=$('#s1').value;S.tpl2=$('#s2').value;save();toast('Pengaturan tersimpan')}
function repData(){const mon=[],map={};for(let m=rf;m<=rt;m=addM(m+'-01',1).slice(0,7)){const B=bills(m);mon.push({m,B,tot:B.reduce((s,b)=>s+b.amt,0),got:B.filter(b=>b.pay).reduce((s,b)=>s+b.pay.amount,0),n:B.filter(b=>b.pay).length,c:B.length});B.forEach(b=>{const r=map[b.t.id]||(map[b.t.id]={no:b.t.room,name:b.t.name,got:0,n:0});if(b.pay){r.got+=b.pay.amount;r.n++}})}
 return{mon,rm:Object.values(map).sort((a,b)=>a.no.localeCompare(b.no)),tot:mon.reduce((s,m)=>s+m.tot,0),got:mon.reduce((s,m)=>s+m.got,0)}}
async function saveFile(name,data){const d=window.claude&&await claude.use('downloads');if(!d)return toast('Unduh tidak tersedia di tampilan ini');try{await d.save({filename:name,data});toast('File disimpan')}catch(e){if(e&&e.code!='declined')toast('Gagal menyimpan file')}}
function exportXlsx(){if(!window.XLSX)return toast('Library Excel belum termuat');const R=repData(),wb=XLSX.utils.book_new(),add=(n,rows,w)=>{const s=XLSX.utils.aoa_to_sheet(rows);s['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,s,n)};
 add('Ringkasan',[['Kost Anugrah Jaya – Laporan Pembayaran'],[ml(rf)+' s/d '+ml(rt)],[],['Periode','Tagihan (Rp)','Terbayar (Rp)','Belum Terbayar (Rp)','Lunas','Jumlah Tagihan'],...R.mon.map(m=>[ml(m.m),m.tot,m.got,m.tot-m.got,m.n,m.c]),['TOTAL',R.tot,R.got,R.tot-R.got,'','']],[22,16,16,20,8,14]);
 const det=[['Periode','No. Kamar','Penghuni','No. WA','Jatuh Tempo','Tagihan (Rp)','Status','Tgl Bayar','Dibayar (Rp)','Metode','Catatan']];R.mon.forEach(m=>m.B.forEach(b=>det.push([ml(m.m),b.t.room,b.t.name,b.t.wa,fd(b.due),b.amt,b.pay?'Lunas':b.st=='terlambat'?'Terlambat':'Belum bayar',b.pay?fd(b.pay.paid):'',b.pay?b.pay.amount:'',b.pay?.method||'',b.pay?.note||''])));
 add('Detail Pembayaran',det,[16,10,32,16,14,14,12,14,14,16,30]);
 add('Belum Lunas',[['Periode','No. Kamar','Penghuni','No. WA','Jatuh Tempo','Tagihan (Rp)','Status'],...det.slice(1).filter(r=>r[6]!='Lunas').map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6]])],[16,10,32,16,14,14,12]);
 add('Rekap per Kamar',[['No. Kamar','Penghuni','Total Terbayar (Rp)','Periode Terbayar'],...R.rm.map(r=>[r.no,r.name,r.got,r.n])],[10,32,20,16]);
 saveFile(`Laporan_Kost_Anugrah_Jaya_${rf}_${rt}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}))}
const backup=()=>saveFile('backup_kost_anugrah_jaya.json',JSON.stringify(S));
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.rooms||!j.tenants||!j.pays)throw 0;S=j;render();toast('Data dipulihkan')}catch(e){toast('File backup tidak valid')}};r.readAsText(f)}
const AK='kaj-auth',SK='kaj-sess',ld=()=>{try{return JSON.parse(localStorage.getItem(AK))}catch(e){return null}};
const hs=async(p,salt)=>{const b=new TextEncoder().encode(salt+':'+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of b)h=(h*33^c)>>>0;return'x'+h};
let fails=0,until=0,hid=0;
function lockUI(mode){document.body.classList.add('lk');const e=$('#lk'),st=mode=='setup';e.hidden=false;
 e.innerHTML=`<form class="lb">${$('.lg').outerHTML.replace('class="lg"','class="lg" style="margin:0 auto"')}<h2>${st?'Buat akun admin':'Masuk'}</h2><p>${esc(S.kost)}</p><label>Username</label><input name="u" autocomplete="username" required><label>${st?'Password (min. 6 karakter)':'Password'}</label><input name="p" type="password" autocomplete="${st?'new-password':'current-password'}" required>${st?'<label>Ulangi password</label><input name="p2" type="password" required>':''}<div id="le"></div><button class="pri" style="width:100%;margin-top:12px">${st?'Simpan & masuk':'Masuk'}</button></form>`;
 e.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),m=$('#le');
  if(st){if(f.p.length<6)return m.textContent='Password minimal 6 karakter';if(f.p!=f.p2)return m.textContent='Password tidak sama';const salt=uid()+uid();try{localStorage.setItem(AK,JSON.stringify({u:f.u.trim(),salt,h:await hs(f.p,salt)}))}catch(x){return m.textContent='Penyimpanan tidak tersedia'}unlock()}
  else{if(Date.now()<until)return m.textContent='Terlalu banyak percobaan, tunggu '+Math.ceil((until-Date.now())/1000)+' detik';const a=ld();if(f.u.trim()==a.u&&await hs(f.p,a.salt)==a.h){fails=0;unlock()}else{if(++fails>=5){until=Date.now()+30000;fails=0}m.textContent='Username atau password salah'}}}}
function unlock(){try{sessionStorage.setItem(SK,'1')}catch(e){}document.body.classList.remove('lk');$('#lk').hidden=true;$('#lk').innerHTML=''}
function logout(){try{sessionStorage.removeItem(SK)}catch(e){}lockUI('login')}
function chPw(){modal('Ganti password','<label>Password lama</label><input type="password" name="o" required><label>Password baru (min. 6 karakter)</label><input type="password" name="n" minlength="6" required>',f=>{(async()=>{const a=ld();if(await hs(f.o,a.salt)!=a.h)return toast('Password lama salah');a.h=await hs(f.n,a.salt);localStorage.setItem(AK,JSON.stringify(a));toast('Password diganti')})()})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>12e4&&ld()&&!document.body.classList.contains('lk'))logout()});
(()=>{let ok=false;try{ok=sessionStorage.getItem(SK)=='1'}catch(e){}if(!ld())lockUI('setup');else if(!ok)lockUI('login')})();
render();
(async()=>{try{const d=window.claude&&await claude.use('db');if(d){DB=d;$('#st').textContent='Tersinkron real-time';listen()}else loadLocal()}catch(e){loadLocal()}})();
</script></body></html>
